<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣天氣</title>
  <link rel="stylesheet" href="style.css">
  <!-- 分享預覽 (Open Graph) -->
  <meta name="description" content="台灣各縣市行政區天氣預報">
  <meta property="og:title"       content="台灣天氣">
  <meta property="og:description" content="台灣各縣市行政區天氣預報">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://rink42.github.io/taiwan-weather/">
  <meta property="og:image"       content="https://rink42.github.io/taiwan-weather/icon-512.png">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#302b63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="台灣天氣">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row1">
        <h1 class="logo" id="appTitle">🌤 台灣天氣</h1>
        <div class="header-controls">
          <select id="countySelect" class="county-select"></select>
          <select id="districtSelect" class="county-select hidden"></select>
          <button id="geoBtn" class="geo-btn" title="偵測目前位置">📍 定位</button>
          <button id="saveBtn" class="save-btn hidden" title="儲存此地點">＋</button>
          <div class="intl-search-wrap">
            <input id="intlSearch" type="text" class="intl-search" placeholder="🌍 城市搜尋" autocomplete="off">
            <button id="intlClear" class="intl-clear hidden" title="清除">✕</button>
            <div id="intlSuggestions" class="intl-suggestions hidden"></div>
          </div>
          <button id="cameraBtn" class="cam-open-btn" title="拍照天氣貼圖">📷</button>
          <span id="updateTime" class="update-time"></span>
        </div>
      </div>
      <div class="header-row2">
        <select id="savedSelect" class="county-select hidden"></select>
      </div>
    </header>

    <main class="main">
      <!-- API Key 提示（未設定時顯示） -->
      <div id="apiKeyNotice" class="api-key-notice hidden">
        <p>⚠️ 請在 <code>app.js</code> 頂部填入您的中央氣象署 API Key。</p>
        <p>申請網址：<a href="https://opendata.cwa.gov.tw/user/authkey" target="_blank">opendata.cwa.gov.tw</a></p>
      </div>

      <!-- 載入中 -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>載入天氣資料中…</p>
      </div>

      <!-- 錯誤訊息 -->
      <div id="errorMsg" class="error-msg hidden"></div>

      <!-- 當前天氣 -->
      <section id="currentWeather" class="current-weather card hidden">
        <div class="current-main">
          <div class="current-icon" id="currentIcon"></div>
          <div class="current-temp-block">
            <div class="current-temp" id="currentTemp"></div>
            <div class="current-desc" id="currentDesc"></div>
          </div>
        </div>
        <div class="current-details">
          <div class="detail-item">
            <span class="detail-label">體感</span>
            <span class="detail-value" id="currentAT"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">濕度</span>
            <span class="detail-value" id="currentRH"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">風速</span>
            <span class="detail-value" id="currentWS"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">降雨</span>
            <span class="detail-value" id="currentPoP"></span>
          </div>
        </div>
      </section>

      <!-- 逐小時預報（今日或選定日） -->
      <section id="hourlySection" class="hourly-section hidden">
        <h2 class="section-title" id="hourlyTitle">今日逐時預報</h2>
        <div class="hourly-scroll">
          <div id="hourlyList" class="hourly-list"></div>
        </div>
      </section>

      <!-- 7 天預報 -->
      <section id="dailySection" class="daily-section hidden">
        <h2 class="section-title">七日預報</h2>
        <div id="dailyList" class="daily-list"></div>
      </section>
    </main>
  </div>

  <!-- 相機預覽 Modal -->
  <div id="cameraModal" class="modal-overlay hidden">
    <div class="camera-view">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-bar">
        <button id="closeCameraBtn" class="cam-btn cam-close">✕ 關閉</button>
        <button id="captureBtn" class="cam-btn cam-shutter">📸 拍照</button>
        <label class="cam-btn cam-album" title="從相簿選取">
          🖼️ 相簿
          <input type="file" id="albumInput" accept="image/*" style="display:none">
        </label>
      </div>
    </div>
  </div>

  <!-- 照片編輯 Modal -->
  <div id="photoEditorModal" class="modal-overlay hidden">
    <div class="photo-editor">
      <div id="photoContainer" class="photo-container">
        <canvas id="photoCanvas"></canvas>
        <div id="badgeLocation" class="badge">📍 <span id="badgeLocationText"></span></div>
        <div id="badgeIcon"     class="badge badge-icon"></div>
        <div id="badgeTemp"     class="badge badge-temp"></div>
        <div id="badgeDesc"     class="badge"><span id="badgeDescText"></span></div>
      </div>
      <div id="badgeToolbar" class="badge-toolbar hidden">
        <div class="badge-toolbar-colors">
          <button class="badge-color-btn" data-color="#ffffff" style="background:#fff" title="白"></button>
          <button class="badge-color-btn" data-color="#ffff00" style="background:#ff0" title="黃"></button>
          <button class="badge-color-btn" data-color="#00ffff" style="background:#0ff" title="青"></button>
          <button class="badge-color-btn" data-color="#ff8c00" style="background:#f80" title="橘"></button>
          <button class="badge-color-btn" data-color="#000000" style="background:#000;border-color:rgba(255,255,255,0.4)" title="黑"></button>
          <label class="badge-color-custom" title="自訂顏色">
            <input type="color" id="badgeColorPicker" value="#ffffff">🎨
          </label>
        </div>
        <div class="badge-toolbar-fmts">
          <button id="boldBtn"    class="badge-fmt-btn"><b>B</b></button>
          <button id="italicBtn"  class="badge-fmt-btn"><i>I</i></button>
          <button id="shadowBtn"  class="badge-fmt-btn">外框</button>
          <button id="editTextBtn" class="badge-fmt-btn" title="編輯文字">✏️</button>
        </div>
      </div>
      <div id="badgeEditRow" class="badge-edit-row hidden">
        <input id="badgeEditInput" type="text" class="badge-edit-input" placeholder="輸入文字…">
        <button id="badgeEditConfirm" class="badge-fmt-btn">✓</button>
      </div>
      <div class="editor-bar">
        <button id="retakeBtn" class="cam-btn cam-close">🔄 重拍</button>
        <button id="exportBtn" class="cam-btn cam-shutter">💾 儲存圖片</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
